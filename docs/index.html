<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gusini-3.6</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


:root {

    --background: #f5f5f7;
    --surface: #ffffff;

    --text: #1d1d1f;
    --secondary: #6e6e73;

    --border: #d2d2d7;

    --accent: #0071e3;

    --error: #d70015;

    --shadow:
        0 8px 30px rgba(0,0,0,.08);

}



body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;


    background: var(--background);

    color: var(--text);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:24px;

}




.app {

    width:100%;

    max-width:900px;

    height:90vh;

    background:var(--surface);

    border-radius:22px;

    box-shadow:var(--shadow);

    display:flex;

    flex-direction:column;

    overflow:hidden;

}




.header {

    height:72px;

    display:flex;

    align-items:center;

    padding:0 32px;

    border-bottom:1px solid var(--border);

}




.logo {

    font-size:20px;

    font-weight:600;

    letter-spacing:-.02em;

}




.status {

    margin-left:auto;

    color:var(--secondary);

    font-size:14px;

    display:flex;

    align-items:center;

    gap:8px;

}



.status-dot {

    width:8px;

    height:8px;

    background:#34c759;

    border-radius:50%;

}





.chat {

    flex:1;

    overflow-y:auto;

    padding:32px;

    display:flex;

    flex-direction:column;

    gap:18px;

}





/* EMPTY STATE */

.empty-state {

    flex:1;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    animation:appear .4s ease;

}



.empty-state h1 {

    font-size:32px;

    margin-bottom:12px;

    letter-spacing:-.03em;

}



.empty-state p {

    color:var(--secondary);

    font-size:18px;

    margin-bottom:30px;

}



.suggestions {

    display:grid;

    grid-template-columns:repeat(2,220px);

    gap:12px;

}



.suggestion {

    background:white;

    border:1px solid var(--border);

    border-radius:14px;

    padding:14px;

    cursor:pointer;

    font-size:14px;

    transition:.2s;

}



.suggestion:hover {

    transform:translateY(-2px);

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}





.message-wrapper {

    position:relative;

    max-width:75%;

    animation:appear .25s ease;

}



.message {

    padding:14px 18px;

    border-radius:16px;

    line-height:1.5;

    font-size:15px;

    white-space:pre-wrap;

}




.user {

    align-self:flex-end;

}



.user .message {

    background:#1d1d1f;

    color:white;

    border-bottom-right-radius:5px;

}



.assistant {

    align-self:flex-start;

}



.assistant .message {

    padding-right:50px;

    background:#f1f1f3;

    color:var(--text);

    border-bottom-left-radius:5px;

}

.message h1,
.message h2,
.message h3 {

    margin:16px 0 10px;

    font-weight:600;

    letter-spacing:-0.02em;

}



.message p {

    margin:10px 0;

}



.message strong {

    font-weight:700;

}



.message ul,
.message ol {

    margin:12px 0;

    padding-left:24px;

}



.message li {

    margin:6px 0;

}



.message code {

    background:#e5e5e7;

    padding:3px 6px;

    border-radius:6px;

    font-family:
    SFMono-Regular,
    Consolas,
    monospace;

    font-size:13px;

}



.message pre {

    background:#1d1d1f;

    color:white;

    padding:16px;

    border-radius:12px;

    overflow-x:auto;

    margin:14px 0;

}



.message pre code {

    background:none;

    padding:0;

    color:white;

}



.message blockquote {

    border-left:4px solid #0071e3;

    padding-left:14px;

    color:#6e6e73;

    margin:12px 0;

}


.copy {

    position:absolute;

    right:10px;

    top:10px;


    opacity:0;


    width:28px;
    height:28px;


    display:flex;
    align-items:center;
    justify-content:center;


    padding:0;


    background:#ffffff;

    color:#1d1d1f;


    border:1px solid #d2d2d7;

    border-radius:8px;


    font-size:14px;


    cursor:pointer;


    transition:.2s;


    z-index:5;

}



.copy.copied {

    width:auto;

    padding:0 8px;


    background:#34c759;

    color:white;

    border-color:#34c759;


    font-size:12px;

}



.message-wrapper:hover .copy {

    opacity:1;

}




.loading {

    display:flex;

    gap:5px;

    align-items:center;

}



.loading span {

    width:6px;

    height:6px;

    background:#8e8e93;

    border-radius:50%;

    animation:pulse 1.2s infinite;

}



.loading span:nth-child(2){

    animation-delay:.2s;

}



.loading span:nth-child(3){

    animation-delay:.4s;

}




.error {

    align-self:center;

    color:var(--error);

    font-size:14px;

}




.input-area {

    border-top:1px solid var(--border);

    padding:20px 24px;

    display:flex;

    gap:12px;

}





textarea {

    flex:1;

    resize:none;

    min-height:52px;

    max-height:170px;

    overflow-y:auto;

    padding:15px 16px;

    border-radius:14px;

    border:1px solid var(--border);

    font-size:15px;

    font-family:inherit;

    outline:none;

}



textarea:focus {

    border-color:#999;

    box-shadow:0 0 0 3px rgba(0,0,0,.05);

}





button {

    width:110px;

    border:none;

    border-radius:14px;

    background:#1d1d1f;

    color:white;

    font-size:15px;

    cursor:pointer;

    transition:.15s;

}



button:hover {

    opacity:.85;

}



button:active {

    transform:scale(.97);

}



button.stop {

    background:#d70015;

}



button:disabled {

    opacity:.45;

}




@keyframes appear {

    from {

        opacity:0;

        transform:translateY(8px);

    }


    to {

        opacity:1;

        transform:translateY(0);

    }

}



@keyframes pulse {

    0%,100% {

        opacity:.3;

    }

    50% {

        opacity:1;

    }

}





@media(max-width:700px){


body {

    padding:0;

}


.app {

    height:100vh;

    border-radius:0;

}


.header {

    padding:0 20px;

}


.chat {

    padding:20px;

}


.message-wrapper {

    max-width:90%;

}


.suggestions {

    grid-template-columns:1fr;

}


.input-area {

    padding:14px;

}


button {

    width:80px;

}


}


</style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app">


<header class="header">

    <div class="logo">
        🪿 Gusini 3.6
    </div>


    <div class="status">

        <div class="status-dot"></div>

        Online

    </div>

</header>



<main class="chat" id="chat">


<div class="empty-state" id="emptyState">

    <h1>Gusini AI</h1>

    <p>How can I help you today?</p>


    <div class="suggestions">


        <div class="suggestion">
            💻 Write some code
        </div>


        <div class="suggestion">
            🐞 Explain the error
        </div>


        <div class="suggestion">
            🌐 Translate the text
        </div>


        <div class="suggestion">
            💡 Come up with an idea
        </div>


    </div>

</div>


</main>




<div class="input-area">


<textarea
id="prompt"
placeholder="Enter your message..."
rows="1"></textarea>


<button id="send">
↑
</button>


</div>


</div>





<script>


const API_URL = "http://localhost:8000";


const chat =
document.getElementById("chat");


const input =
document.getElementById("prompt");


const sendButton =
document.getElementById("send");


const emptyState =
document.getElementById("emptyState");



let generating = false;

let stopped = false;





function scrollDown(){

    chat.scrollTop =
    chat.scrollHeight;

}



function removeEmpty(){

    if(emptyState){

        emptyState.style.opacity="0";

        setTimeout(()=>{

            emptyState.remove();

        },300);

    }

}






function addMessage(text, role){


    removeEmpty();



    const wrapper =
    document.createElement("div");


    wrapper.className =
    "message-wrapper " + role;



    const message =
    document.createElement("div");


    message.className =
    "message";


    if(role === "assistant") {

    message.innerHTML =
    marked.parse(text);

}
else {

    message.textContent =
    text;

}



    wrapper.appendChild(message);



    if(role==="assistant"){


        const copy =
        document.createElement("button");


        copy.className="copy";


        copy.textContent="⧉";



        copy.onclick = async () => {

    try {

        await navigator.clipboard.writeText(text);


        copy.textContent = "✓ Copied";

        copy.classList.add("copied");

        copy.style.opacity = "1";



        setTimeout(() => {


            copy.textContent = "⧉";

            copy.classList.remove("copied");


        },1000);



    } catch(error) {


        copy.textContent = "×";


        setTimeout(()=>{

            copy.textContent="⧉";

        },1000);


    }

};


        wrapper.appendChild(copy);


    }



    chat.appendChild(wrapper);


    scrollDown();



    return wrapper;

}








function addLoading(){


    removeEmpty();



    const wrapper =
    document.createElement("div");


    wrapper.className =
    "message-wrapper assistant";


    wrapper.id="loading";



    wrapper.innerHTML=`

        <div class="message">

            <div class="loading">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chat.appendChild(wrapper);


    scrollDown();


    return wrapper;

}







function showError(text){


    const div =
    document.createElement("div");


    div.className="error";


    div.textContent=text;


    chat.appendChild(div);


}







async function loadHistory(){


try{


const response =
await fetch(
`${API_URL}/requests`
);



if(!response.ok)
throw new Error();



const data =
await response.json();




if(Array.isArray(data)){



data.forEach(item=>{


if(item.prompt){

addMessage(
item.prompt,
"user"
);

}



if(item.response){

addMessage(
item.response,
"assistant"
);

}



});



}



}

catch(e){

console.log(
"The history is not available"
);

}


}









async function sendMessage(){


if(generating){

    stopped=true;

    sendButton.textContent="↑";

    sendButton.classList.remove("stop");

    return;

}




const text =
input.value.trim();



if(!text)
return;



generating=true;


stopped=false;



sendButton.textContent="■ Stop";


sendButton.classList.add("stop");



input.disabled=true;




addMessage(
text,
"user"
);



input.value="";


autoResize();




const loading =
addLoading();




try{


const response =
await fetch(

`${API_URL}/requests`,

{

method:"POST",


headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

prompt:text

})

}

);




if(!response.ok)

throw new Error();




const data =
await response.json();




loading.remove();



if(stopped){

addMessage(
"Generation has been stopped",
"assistant"
);

return;

}




if(data.answer){


addMessage(
data.answer,
"assistant"
);


}

else{


showError(
"Empty server response"
);


}



}



catch(e){



loading.remove();


showError(
"Error connecting to the server"
);



}



finally{


generating=false;


sendButton.textContent="↑";


sendButton.classList.remove("stop");


input.disabled=false;


input.focus();


}



}








function autoResize(){


input.style.height="auto";


input.style.height =

Math.min(
input.scrollHeight,
170
)
+
"px";


}








sendButton.onclick =
sendMessage;





input.addEventListener(
"keydown",
e=>{


if(
e.key==="Enter"
&&
!e.shiftKey
){

e.preventDefault();


sendMessage();


}


});






input.addEventListener(
"input",
autoResize
);








document
.querySelectorAll(".suggestion")
.forEach(btn=>{


btn.onclick=()=>{


input.value =
btn.textContent
.replace(/^[^ ]+ /,"");


autoResize();


input.focus();


};



});







loadHistory();



</script>


</body>
</html>
